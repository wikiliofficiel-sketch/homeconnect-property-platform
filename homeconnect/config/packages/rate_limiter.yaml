framework:
    rate_limiter:
        login_limiter:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.app

        register_limiter:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
            cache_pool: cache.app

        api_limiter:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
            cache_pool: cache.app

        reset_password_limiter:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
            cache_pool: cache.app
